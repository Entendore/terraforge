[package]
name = "terraforge"
version = "1.0.0"
edition = "2021"
description = "Professional procedural terrain generator for games and TTRPGs"
authors = ["TerraForge Team"]

[dependencies]
noise = "0.9"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
image = "0.25"
imageproc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
indicatif = "0.17"
console = "0.15"
toml = "0.8"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
